<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>多模型协作与工程记忆架构 · 现场演示</title>
<style>
  :root {
    --bg: #eef1f6;
    --card: #ffffff;
    --ink: #0f172a;
    --ink-2: #334155;
    --ink-3: #64748b;
    --line: #dbe1ea;
    --edge: #475569;
    --hl: #4f46e5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--ink);
    display: grid; grid-template-rows: auto 1fr auto; height: 100vh; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: center; gap: 24px; padding: 14px 28px;
    background: var(--card); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
  header h1 small { display: block; font-size: 12px; font-weight: 400; color: var(--ink-3); margin-top: 2px; letter-spacing: 0; }
  .tabs { display: flex; gap: 6px; background: #f1f5f9; padding: 4px; border-radius: 10px; margin-left: auto; }
  .tabs button {
    border: 0; background: transparent; padding: 9px 18px; border-radius: 7px; cursor: pointer;
    font: inherit; font-size: 15px; color: var(--ink-2); display: flex; align-items: center; gap: 8px;
  }
  .tabs button kbd {
    font: 600 11px/1 ui-monospace, Menlo, Consolas, monospace; padding: 3px 6px; border-radius: 4px;
    background: #e2e8f0; color: var(--ink-3);
  }
  .tabs button.on { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(15,23,42,.12); }
  .tabs button.on kbd { background: var(--hl); color: #fff; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; padding: 16px 20px; min-height: 0; }
  .stage {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; min-height: 0;
    display: flex; align-items: center; justify-content: center; padding: 8px; position: relative;
  }
  .stage svg { width: 100%; height: 100%; display: none; }
  .stage svg.on { display: block; }

  /* SVG 元素 */
  .lane-bg { stroke: none; transition: opacity .25s; }
  .lane-name { font-size: 16px; font-weight: 700; }
  .lane-sub { font-size: 12px; fill: var(--ink-3); }
  .group-box { fill-opacity: .45; stroke-width: 1.5; stroke-dasharray: 6 5; transition: opacity .25s; }
  .group-label { font-size: 14px; font-weight: 700; }
  .group-hit { cursor: pointer; }
  .node { cursor: pointer; transition: opacity .25s; outline: none; }
  .node rect.body { stroke-width: 1.6; transition: stroke-width .2s, filter .2s; }
  .node:hover rect.body, .node:focus rect.body { stroke-width: 2.6; }
  .node .title { font-size: 17px; font-weight: 700; fill: var(--ink); }
  .node .sub { font-size: 13.5px; fill: var(--ink-2); }
  .node.sel rect.body { stroke-width: 3.2; filter: drop-shadow(0 6px 14px rgba(79,70,229,.28)); }
  .edge { transition: opacity .25s; }
  .edge path.base { fill: none; stroke: var(--edge); stroke-width: 1.8; stroke-linejoin: round; }
  .edge.dashed path.base { stroke-dasharray: 7 5; stroke: #64748b; }
  .edge.bold path.base { stroke-width: 2.8; stroke: #1e293b; }
  .edge path.flow { fill: none; stroke: #fff; stroke-width: 2.2; stroke-dasharray: 2 16; stroke-linecap: round; opacity: 0; }
  .edge text { font-size: 12.5px; fill: var(--ink-2); paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; font-weight: 500; }
  .edge.hl path.base { stroke: var(--hl); stroke-width: 3.2; }
  .edge.hl path.flow { opacity: 1; animation: flow 1s linear infinite; }
  .edge.hl text { fill: var(--hl); font-weight: 700; }
  @keyframes flow { to { stroke-dashoffset: -18; } }
  svg.focus .node:not(.rel), svg.focus .edge:not(.hl) { opacity: .16; }
  svg.focus .group-box, svg.focus .lane-bg { opacity: .55; }

  /* 讲解面板 */
  aside {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 22px 18px;
    overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
  }
  .p-kicker { font-size: 12px; font-weight: 600; letter-spacing: 1px; color: var(--ink-3); }
  .p-title { font-size: 22px; font-weight: 700; line-height: 1.3; }
  .p-lead { font-size: 15px; line-height: 1.7; color: var(--ink-2); }
  .p-tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; margin-top: 6px; }
  .p-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .p-list li { font-size: 15px; line-height: 1.6; color: var(--ink-2); padding-left: 16px; position: relative; }
  .p-list li::before { content: ""; position: absolute; left: 0; top: .62em; width: 7px; height: 7px; border-radius: 2px; background: var(--dot, var(--hl)); }
  .p-list li b { color: var(--ink); }
  .p-rel h4 { font-size: 12px; color: var(--ink-3); font-weight: 600; letter-spacing: 1px; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button {
    font: inherit; font-size: 13px; border: 1px solid var(--line); background: #f8fafc; color: var(--ink-2);
    padding: 5px 10px; border-radius: 7px; cursor: pointer; text-align: left;
  }
  .chips button:hover { border-color: var(--hl); color: var(--hl); }
  .chips button i { font-style: normal; color: var(--ink-3); margin-right: 4px; }
  .p-foot { margin-top: auto; font-size: 12.5px; color: var(--ink-3); line-height: 1.7; border-top: 1px dashed var(--line); padding-top: 12px; }
  code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .92em; background: #f1f5f9; padding: 1px 5px; border-radius: 4px; }

  footer {
    display: flex; align-items: center; gap: 26px; padding: 10px 28px 14px; font-size: 13px; color: var(--ink-3);
  }
  footer .lg { display: flex; align-items: center; gap: 8px; }
  footer .keys { margin-left: auto; }
  footer kbd { font: 600 11px/1 ui-monospace, Menlo, Consolas, monospace; padding: 3px 6px; border-radius: 4px; background: #e2e8f0; color: var(--ink-2); }
</style>
</head>

    ],

  /* ================= 渲染 ================= */
  function mk(tag, attrs, parent, text) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) if (Object.prototype.hasOwnProperty.call(attrs, k)) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }

  // 带圆角拐点的正交折线
  function pathD(pts) {
    var r = 10, d = 'M' + pts[0][0] + ' ' + pts[0][1];
    for (var i = 1; i < pts.length; i++) {
      var p = pts[i];
      if (i < pts.length - 1) {
        var a = pts[i - 1], n = pts[i + 1];
        var l1 = Math.hypot(p[0] - a[0], p[1] - a[1]), l2 = Math.hypot(n[0] - p[0], n[1] - p[1]);
        var rr = Math.min(r, l1 / 2, l2 / 2);
        var x1 = p[0] - (p[0] - a[0]) / l1 * rr, y1 = p[1] - (p[1] - a[1]) / l1 * rr;
        var x2 = p[0] + (n[0] - p[0]) / l2 * rr, y2 = p[1] + (n[1] - p[1]) / l2 * rr;
        d += ' L' + x1 + ' ' + y1 + ' Q' + p[0] + ' ' + p[1] + ' ' + x2 + ' ' + y2;
      } else {
        d += ' L' + p[0] + ' ' + p[1];
      }
    }
    return d;
  }

  function addMarkers(defs, vid) {
    [['n', '#475569'], ['b', '#1e293b'], ['d', '#64748b'], ['h', '#4f46e5']].forEach(function (m) {
      var mm = mk('marker', { id: vid + '-' + m[0], viewBox: '0 0 10 10', refX: '9', refY: '5',
        markerWidth: '13', markerHeight: '13', markerUnits: 'userSpaceOnUse', orient: 'auto-start-reverse' }, defs);
      mk('path', { d: 'M0 0 L10 5 L0 10 Z', fill: m[1] }, mm);
    });
  }

  function render(V) {
    var svg = mk('svg', { viewBox: '0 0 ' + V.w + ' ' + V.h, preserveAspectRatio: 'xMidYMid meet', id: V.id,
      role: 'img', 'aria-label': V.name });
    var defs = mk('defs', {}, svg);
    addMarkers(defs, V.id);
    var bg = mk('rect', { x: 0, y: 0, width: V.w, height: V.h, fill: 'transparent' }, svg);
    bg.addEventListener('click', function () { select(null); });

    // 泳道
    V.lanes.forEach(function (L) {
      var P = PALETTE[L.c];
      var lane = mk('rect', { class: 'lane-bg', x: 16, y: L.y, width: V.w - 32, height: L.h, rx: 12, fill: P.tint }, svg);
      lane.addEventListener('click', function () { select(null); });
      mk('rect', { x: 16, y: L.y, width: 6, height: L.h, rx: 3, fill: P.stroke }, svg);
      mk('text', { class: 'lane-name', x: 38, y: L.y + 34, fill: P.ink }, svg, L.name);
      mk('text', { class: 'lane-sub', x: 38, y: L.y + 54 }, svg, L.sub);
    });

    // 分组框
    V.groups.forEach(function (G) {
      if (G.hidden) return;
      var P = PALETTE[G.c];
      var g = mk('g', { 'data-group': G.id }, svg);
      var box = mk('rect', { class: 'group-box group-hit', x: G.x, y: G.y, width: G.w, height: G.h, rx: 14,
        fill: P.tint, stroke: P.stroke }, g);
      box.addEventListener('click', function (ev) { ev.stopPropagation(); select(G.id); });
      if (G.label) {
        var lx = G.x + 16, ly = G.lpos === 'bottom' ? G.y + G.h - 16 : G.y + 28;
        if (G.lpos === 'left') ly = G.y + G.h / 2 + 5;
        var t = mk('text', { class: 'group-label group-hit', x: lx, y: ly, fill: P.ink }, g, G.label);
        t.addEventListener('click', function (ev) { ev.stopPropagation(); select(G.id); });
      }
    });

    // 连线（画在节点下方）
    var edgeLayer = mk('g', {}, svg);
    V.edges.forEach(function (E) {
      var g = mk('g', { class: 'edge ' + (E.kind || '') }, edgeLayer);
      var d = pathD(E.pts);
      E._mkey = E.kind === 'bold' ? 'b' : E.kind === 'dashed' ? 'd' : 'n';
      E._base = mk('path', { class: 'base', d: d }, g);
      mk('path', { class: 'flow', d: d }, g);
      if (E.label) {
        var ta = { x: E.lx, y: E.ly, 'text-anchor': E.anchor || 'middle' };
        if (E.rotate) { ta['text-anchor'] = 'middle'; ta.transform = 'rotate(-90 ' + E.lx + ' ' + E.ly + ')'; }
        mk('text', ta, g, E.label);
      }
      E._g = g;
      setMarker(V, E, E._mkey);
    });

    // 节点
    V.nodes.forEach(function (N) {
      var P = PALETTE[N.c];
      var g = mk('g', { class: 'node', 'data-id': N.id, tabindex: '0' }, svg);
      mk('rect', { class: 'body', x: N.x, y: N.y, width: N.w, height: N.h, rx: 12, fill: P.fill, stroke: P.stroke }, g);
      mk('rect', { x: N.x + 1, y: N.y + 14, width: 5, height: N.h - 28, rx: 2.5, fill: P.stroke }, g);
      var single = N.h < 90;
      mk('text', { class: 'title', x: N.x + 20, y: N.y + (single ? 30 : 32) }, g, N.title);
      (N.sub || []).forEach(function (s, k) {
        mk('text', { class: 'sub', x: N.x + 20, y: N.y + (single ? 54 : 58) + k * 22 }, g, s);
      });
      g.addEventListener('click', function (ev) { ev.stopPropagation(); select(N.id); });
      N._g = g;
    });

    V._svg = svg;
    return svg;
  }

  function setMarker(V, E, key) {
    var url = 'url(#' + V.id + '-' + key + ')';
    E._base.setAttribute('marker-end', url);
    if (E.both) E._base.setAttribute('marker-start', url);
  }

  /* ================= 交互 ================= */
  var VIEWS = { v1: V1, v2: V2 };
  var cur = V1, selected = null;
  var stage = document.getElementById('stage');
  var panel = document.getElementById('panel');

  function byId(V, id) {
    for (var i = 0; i < V.nodes.length; i++) if (V.nodes[i].id === id) return V.nodes[i];
    for (var j = 0; j < V.groups.length; j++) if (V.groups[j].id === id) return V.groups[j];
    return null;
  }
  function childrenOf(V, gid) {
    return V.nodes.filter(function (n) { return n.group === gid; }).map(function (n) { return n.id; });
  }
  function isGroupId(V, id) {
    return V.groups.some(function (g) { return g.id === id; });
  }

  function select(id) {
    var V = cur, svg = V._svg;
    selected = id;
    V.nodes.forEach(function (N) { N._g.classList.remove('sel', 'rel'); });
    V.edges.forEach(function (E) { E._g.classList.remove('hl'); setMarker(V, E, E._mkey); });
    if (!id) { svg.classList.remove('focus'); renderOverview(V); return; }

    var item = byId(V, id);
    if (!item) { select(null); return; }
    var isGroup = isGroupId(V, id);

    // 「自身」集合：节点 = 自己 + 所属分组；分组 = 自己 + 全部成员
    var self = [id];
    if (isGroup) self = self.concat(childrenOf(V, id));
    else if (item.group) self.push(item.group);

    var relEdges = V.edges.filter(function (E) { return self.indexOf(E.from) >= 0 || self.indexOf(E.to) >= 0; });
    var related = {};
    relEdges.forEach(function (E) {
      [E.from, E.to].forEach(function (end) {
        if (self.indexOf(end) >= 0) return;
        related[end] = true;
        // 对端是分组时，点亮它的成员
        if (isGroupId(V, end)) childrenOf(V, end).forEach(function (c) { related[c] = true; });
      });
    });
    self.forEach(function (s) { if (isGroup || s === id) related[s] = true; });

    svg.classList.add('focus');
    V.nodes.forEach(function (N) {
      if (related[N.id]) N._g.classList.add('rel');
      if (N.id === id || (isGroup && N.group === id)) N._g.classList.add('sel');
    });
    relEdges.forEach(function (E) { E._g.classList.add('hl'); setMarker(V, E, 'h'); });
    renderDetail(V, item, relEdges, self, isGroup);
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  }
  function nameOf(V, id) { var it = byId(V, id); return it ? it.title : id; }

  function renderOverview(V) {
    var o = V.overview;
    panel.innerHTML =
      '<div><div class="p-kicker">' + esc(o.kicker) + ' · 总览</div>' +
      '<div class="p-title">' + esc(o.title) + '</div></div>' +
      '<p class="p-lead">' + esc(o.lead) + '</p>' +
      '<ul class="p-list">' + o.points.map(function (p) { return '<li>' + p + '</li>'; }).join('') + '</ul>' +
      '<div class="p-rel"><h4>按顺序讲解</h4><div class="chips">' +
      V.nodes.map(function (n, i) { return '<button data-go="' + n.id + '"><i>' + (i + 1) + '</i>' + esc(n.title) + '</button>'; }).join('') +
      '</div></div>' +
      '<div class="p-foot">点击图中任意节点或分组标题，高亮它的上下游连线；按 <code>←</code> <code>→</code> 逐个讲解，<code>Esc</code> 或点空白处回到总览。</div>';
    bindChips();
  }

  function renderDetail(V, item, relEdges, self, isGroup) {
    var P = PALETTE[item.c];
    function inSelf(x) { return self.indexOf(x) >= 0; }
    var inE = relEdges.filter(function (E) { return inSelf(E.to) && !inSelf(E.from); });
    var outE = relEdges.filter(function (E) { return inSelf(E.from) && !inSelf(E.to); });
    var inner = relEdges.filter(function (E) { return inSelf(E.from) && inSelf(E.to); });
    function chip(E, dir) {
      var other = dir === 'in' ? E.from : E.to;
      var lbl = E.label ? '（' + E.label + '）' : '';
      return '<button data-go="' + other + '"><i>' + (dir === 'in' ? '←' : '→') + '</i>' + esc(nameOf(V, other)) + esc(lbl) + '</button>';
    }
    function block(title, html) { return html ? '<div class="p-rel"><h4>' + title + '</h4><div class="chips">' + html + '</div></div>' : ''; }
    var idx = V.nodes.indexOf(item);
    panel.innerHTML =
      '<div><div class="p-kicker">' + esc(V.overview.kicker) + (isGroup ? ' · 分组' : ' · 节点 ' + (idx + 1) + ' / ' + V.nodes.length) + '</div>' +
      '<div class="p-title">' + esc(item.title) + '</div>' +
      '<span class="p-tag" style="background:' + P.fill + ';color:' + P.ink + ';border:1px solid ' + P.stroke + '">' + esc(item.tag || '') + '</span></div>' +
      '<ul class="p-list" style="--dot:' + P.stroke + '">' + (item.points || []).map(function (p) { return '<li>' + p + '</li>'; }).join('') + '</ul>' +
      block('上游（流入）', inE.map(function (E) { return chip(E, 'in'); }).join('')) +
      block('下游（流出）', outE.map(function (E) { return chip(E, 'out'); }).join('')) +
      block('内部协作', inner.map(function (E) {
        return '<button data-go="' + E.to + '"><i>⇄</i>' + esc(nameOf(V, E.from)) + ' · ' + esc(nameOf(V, E.to)) + (E.label ? esc('（' + E.label + '）') : '') + '</button>';
      }).join('')) +
      '<div class="p-foot"><code>←</code> <code>→</code> 上一个 / 下一个 · <code>Esc</code> 回到总览</div>';
    bindChips();
  }

  function bindChips() {
    Array.prototype.forEach.call(panel.querySelectorAll('[data-go]'), function (b) {
      b.addEventListener('click', function () { select(b.getAttribute('data-go')); });
    });
  }

  function show(vid) {
    cur = VIEWS[vid];
    Array.prototype.forEach.call(stage.querySelectorAll('svg'), function (s) { s.classList.toggle('on', s.id === vid); });
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-view') === vid);
    });
    select(null);
  }

  function step(dir) {
    var ids = cur.nodes.map(function (n) { return n.id; });
    var i = ids.indexOf(selected);
    if (i < 0) i = dir > 0 ? -1 : ids.length;
    var n = i + dir;
    if (n < 0 || n >= ids.length) { select(null); return; }
    select(ids[n]);
  }

  stage.appendChild(render(V1));
  stage.appendChild(render(V2));
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) {
    b.addEventListener('click', function () { show(b.getAttribute('data-view')); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var a = document.activeElement;
    if (e.key === '1') show('v1');
    else if (e.key === '2') show('v2');
    else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); step(1); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); step(-1); }
    else if (e.key === 'Escape') select(null);
    else if (e.key === 'Enter' && a && a.getAttribute && a.getAttribute('data-id')) select(a.getAttribute('data-id'));
  });
  show('v1');
})();
